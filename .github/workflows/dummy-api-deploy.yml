name: dummy api deploy
on:
  push:
    branches:
      - main
      - development
    #paths:
    #  - 'dummy_api/**'

jobs:
  build: 
    runs-on: rhel-sandbox
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ECR_REGISTRY: 000000000000.dkr.ecr.ap-southeast-2.localhost:5100/devsecops-lab
    
    outputs:
      GIT_SHA: ${{ steps.git-sha.outputs.GIT_SHA }}
    
    steps:
      - name: Checkout Repo
        id: checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: Secret Scan
        id: secret-scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup gitleaks tmp
        id: cleanup-gitleaks
        run: rm -f /tmp/gitleaks.tmp

      - name: SAST Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: auto
      
      - name: Set GIT_SHA
        id: git-sha
        run: echo "GIT_SHA=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
        
      - name: Container image build
        id: container-image-build
        working-directory: dummy_api
        run: |
          docker build -t ${{ env.ECR_REGISTRY }}:${{ steps.git-sha.outputs.GIT_SHA }} .
             
      - name: Security Scan
        id: security-scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          scan-ref: ${{ env.ECR_REGISTRY }}:${{ steps.git-sha.outputs.GIT_SHA }}
          severity: 'HIGH,CRITICAL'
          exit-code: 1
  
  deploy:
    needs: build
    runs-on: rhel-sandbox
    permissions:
      contents: read

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      ECR_REGISTRY: 000000000000.dkr.ecr.ap-southeast-2.localhost:5100/devsecops-lab
      LAMBDA_IAM_ROLE: dummy-role
      LAMBDA_FUNC: dummy-func

    steps:
      - name: Container image push
        id: container-image-push
        working-directory: dummy_api
        run: |
          docker push ${{ env.ECR_REGISTRY }}:${{ needs.build.outputs.GIT_SHA }}

      - name: Deploy to Lambda
        id: deploy-to-lambda
        run: |
          shopt -s expand_aliases
          alias floci='docker run --rm --network host -e AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }} -e AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }} -e AWS_DEFAULT_REGION=${{ env.AWS_DEFAULT_REGION }} amazon/aws-cli --endpoint-url=http://localhost:4567'

          floci iam create-role \
            --role-name ${{ env.LAMBDA_IAM_ROLE }} \
            --assume-role-policy-document '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Service":"lambda.amazonaws.com"},"Action":"sts:AssumeRole"}]}' || true

          floci lambda create-function \
            --function-name ${{ env.LAMBDA_FUNC }} \
            --package-type Image \
            --code ImageUri=${{ env.ECR_REGISTRY }}:${{ needs.build.outputs.GIT_SHA }} \
            --role arn:aws:iam::000000000000:role/${{ env.LAMBDA_IAM_ROLE }} || \
          floci lambda update-function-code \
            --function-name ${{ env.LAMBDA_FUNC }} \
            --image-uri ${{ env.ECR_REGISTRY }}:${{ needs.build.outputs.GIT_SHA }}

          floci lambda create-function-url-config \
            --function-name ${{ env.LAMBDA_FUNC }} \
            --auth-type NONE || true
      
      - name: Smoke Test
        id: smoke-test
        run: |
          shopt -s expand_aliases
          alias floci='docker run --rm --network host -e AWS_ACCESS_KEY_ID=${{ env.AWS_ACCESS_KEY_ID }} -e AWS_SECRET_ACCESS_KEY=${{ env.AWS_SECRET_ACCESS_KEY }} -e AWS_DEFAULT_REGION=${{ env.AWS_DEFAULT_REGION }} amazon/aws-cli --endpoint-url=http://localhost:4567'

          FUNCTION_URL=$(floci lambda get-function-url-config \
            --function-name ${{ env.LAMBDA_FUNC }} \
            --query 'FunctionUrl' \
            --output text)
          curl -f $FUNCTION_URL/health