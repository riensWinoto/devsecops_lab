services:
  ministack:
    container_name: "ministack"
    image: ministackorg/ministack:1.3.28-full
    restart: unless-stopped
    ports:
      - "4566:4566"
    env_file:
      - .env
    environment:
      - PERSIST_STATE=1
      - STATE_DIR=${STATE_DIR:?}
      - S3_PERSIST=1
      - S3_DATA_DIR=${STATE_DIR:?}
    volumes:
      - "ministack:${STATE_DIR:?}"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - ministack

  floci:
    container_name: "floci"
    image: floci/floci:latest
    restart: unless-stopped
    ports:
      - "4567:4566"
    environment:
      - FLOCI_STORAGE_MODE=persistent
      - FLOCI_STORAGE_PERSISTENT_PATH=/app/data
      - FLOCI_SERVICES_DOCKER_NETWORK=devsecops_lab_floci
    volumes:
      - "floci:/app/data"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - floci

volumes:
  ministack:
  floci:

networks:
  ministack:
  floci: