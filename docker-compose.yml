services:
  ministack:
    container_name: "ministack"
    image: ministackorg/ministack:1.3.28-full
    ports:
      - "4566:4566"
    env_file:
      - .env
    environment:
      - PERSIST_STATE=1
      - STATE_DIR=${STATE_DIR:?}
      - S3_PERSIST=1
      - S3_DATA_DIR=${STATE_DIR:?}
    volumes:
      - "ministack:${STATE_DIR:?}"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - ministack
volumes:
  ministack:

networks:
  ministack: